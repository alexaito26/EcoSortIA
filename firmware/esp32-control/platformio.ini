; EcoSort AI - Firmware de control ESP32-S3 (PlatformIO)
;
; Hardware objetivo:
;   - Placa: ESP32-S3 DevKitC-1
;   - 2 servos (giro de tolva + compuerta)
;   - 3 sensores ultrasonicos HC-SR04 (plastic / glass / reject)
;   - TFT ILI9341 SPI (opcional, desacoplado por flag de compilacion)
;   - UART hacia el ESP32-S3 de vision/IA
;
; No colocar credenciales aqui: ver include/secrets.h.example

[platformio]
default_envs = esp32-s3

; ---------------------------------------------------------------------------
; Ajustes comunes al firmware embebido
; ---------------------------------------------------------------------------
[env]
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

; Versiones fijas: un firmware debe compilarse igual dentro de un año.
[env:esp32-s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    madhephaestus/ESP32Servo@3.2.1
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Igual que esp32-s3 pero con la pantalla TFT compilada.
; La app no depende de la pantalla: sin este entorno usa la salida por Serial.
[env:esp32-s3-tft]
extends = env:esp32-s3
lib_deps =
    ${env:esp32-s3.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${env:esp32-s3.build_flags}
    -D ECOSORT_USE_TFT=1
    ; Configuracion del panel ILI9341 (evita editar User_Setup.h de la libreria)
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=14
    -D TFT_RST=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000

; ---------------------------------------------------------------------------
; Pruebas unitarias de la logica pura en el PC (sin hardware).
; Solo compila lo que vive en lib/ecosort_core: cola offline, parser UART,
; backoff y construccion de payloads.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    ${env.build_flags}
    -D ECOSORT_NATIVE_TEST=1
    -I lib/ecosort_core/include
build_src_filter = -<*>
test_build_src = no
